<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">💬 Chats</span>
      <button class="new-chat-btn" id="new-chat-btn">＋ New</button>
    </div>
    <div class="chat-list" id="chat-list"></div>
    <div class="sidebar-footer">
      <button class="memory-btn" id="memory-btn">🧠 Memory</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="toggle-sidebar" id="toggle-sidebar">☰</button>
      <span id="chat-title">Select or start a chat</span>
      <div class="topbar-right">
        <!-- Model selector -->
        <select id="model-select" title="Select AI model">
          <option value="">⏳ Loading models...</option>
        </select>
        <!-- Internet toggle -->
        <button id="internet-btn" class="internet-btn" title="Toggle web search">
          🌐 Internet: OFF
        </button>
      </div>
    </div>

    <div class="chat-box" id="chat">
      <div class="empty-state"><div>🤖</div>Click "＋ New" to start</div>
    </div>

    <div id="file-preview" class="file-preview"></div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Type a message...">
      <label class="file-label" for="file">📎</label>
      <input type="file" id="file" multiple>
      <button id="send-btn">Send</button>
      <button id="stop-btn" disabled>⏹</button>
    </div>
  </div>
</div>

<!-- Memory Modal -->
<div class="modal-overlay" id="memory-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>🧠 Memory</h2>
      <button id="close-memory-btn">✕</button>
    </div>
    <div class="modal-body">
      <p class="memory-hint">Add facts the AI will always remember across all chats.</p>
      <div class="memory-input-row">
        <input type="text" id="memory-input" placeholder="e.g. My name is John, I prefer Python...">
        <button id="add-memory-btn">Add</button>
        <button id="clear-memory-btn" style="margin-left:8px;background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px;">Clear all</button>
      </div>
      <div id="memory-list"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
